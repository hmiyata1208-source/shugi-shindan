<!DOCTYPE html><html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あなたはなに主義？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
/* 白地のページに、主義ごとの色をヒーローだけに敷く。似顔絵は常に白い紙の円に載せる */
:root{
  --bg:#ffffff; --surface:#f4f6fd; --ink:#2a2d45; --mute:#6c7090; --line:#e4e7f3;
  --paper:#ffffff; --accent:#4f62ee; --on-accent:#ffffff; --star:#e9a100;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15161d; --surface:#1f2029; --ink:#ecedf4; --mute:#a3a6ba; --line:#33354a;
  --paper:#f6f4ef; --accent:#9aa5ff; --on-accent:#15161d; --star:#ffc53d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15161d; --surface:#1f2029; --ink:#ecedf4; --mute:#a3a6ba; --line:#33354a;
  --paper:#f6f4ef; --accent:#9aa5ff; --on-accent:#15161d; --star:#ffc53d; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.85;
  line-break:strict;overflow-wrap:anywhere;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
h1,h2,h3{font-family:var(--display);line-height:1.4;text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%}
button{font:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible{outline:3px solid var(--star);outline-offset:3px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ---- disc: one portrait on paper ---- */
.disc{flex:none;display:grid;place-items:center;border-radius:50%;background:var(--paper);
  border:3px solid var(--c,var(--line));overflow:hidden}
.disc img{width:100%;height:100%;object-fit:cover;transform:translateY(6%)}

/* ---- intro ---- */
.intro{padding:40px 0 28px}
.intro h1{font-size:clamp(36px,10.4vw,64px);font-weight:900;letter-spacing:.02em}.intro h1 span{display:inline-block}
.intro .lead{margin-top:14px;font-size:17px;color:var(--mute);max-width:34em}
.faces{display:flex;margin:28px 0 30px}
.faces .disc{width:min(64px,13vw);height:min(64px,13vw);border-width:2px;border-color:var(--line)}
.faces .disc+.disc{margin-left:max(-14px,-2.6vw)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px}
.steps div{background:var(--surface);border-radius:14px;padding:14px 12px;font-size:14px}
.steps b{display:block;font-family:var(--display);font-size:17px;margin-bottom:2px}
@media (max-width:460px){.steps{grid-template-columns:1fr}}
.primary{display:block;width:100%;min-height:58px;border:none;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font-family:var(--display);font-weight:700;font-size:19px}

/* ---- question ---- */
.qtop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px;min-height:64px}
.link{background:none;border:none;color:var(--mute);padding:8px 0;min-height:44px;font-size:15px}
.trail{display:flex;gap:6px;align-items:center}
.trail i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.trail i.done{background:var(--accent)}
.trail i.now{width:26px;border-radius:999px;background:var(--accent)}
.qnum{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px}
.qcard{padding:8px 0 40px}
.qcard h2{font-size:clamp(22px,6vw,30px);font-weight:700;margin:6px 0 22px}
.ex{background:var(--surface);border-radius:18px;padding:18px 20px;font-size:15.5px;margin-bottom:26px}
.ex b{display:block;font-family:var(--display);font-size:15px;color:var(--mute);margin-bottom:6px}
.answer{display:grid;grid-template-columns:1fr 1fr;gap:12px;position:sticky;bottom:0;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0));background:linear-gradient(transparent,var(--bg) 22%)}
.answer button{min-height:62px;border-radius:999px;font-family:var(--display);font-weight:700;font-size:20px}
.yes{background:var(--accent);color:var(--on-accent);border:2px solid var(--accent)}
.no{background:var(--bg);color:var(--accent);border:2px solid var(--accent)}

/* ---- result ---- */
.rhero{background:color-mix(in srgb,var(--c) 20%,var(--bg));border-bottom:4px solid var(--c)}
.rhero .wrap{display:flex;gap:22px;align-items:center;padding-top:34px;padding-bottom:30px}
.rtext{flex:1;min-width:0}
.kicker{color:var(--mute);font-size:15px}
.rhero h1{font-size:clamp(30px,8.4vw,48px);font-weight:900;margin:4px 0 16px;color:var(--ink)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;gap:8px;align-items:baseline;background:var(--bg);border-radius:10px;
  padding:4px 12px;font-size:14px}
.badge b{font-family:var(--display);color:var(--c)}
.rfaces{display:flex;flex:none}
.rfaces .disc{width:150px;height:150px;border-width:4px}
.rfaces .disc+.disc{margin-left:-34px}
@media (max-width:560px){
  .rhero .wrap{flex-direction:column-reverse;align-items:flex-start;gap:16px}
  .rfaces .disc{width:118px;height:118px}
}
.sec{padding:30px 0 4px}
.sec h2{font-size:22px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.sec h2::before{content:"";width:6px;height:22px;border-radius:3px;background:var(--c)}
.sec p+p{margin-top:.9em}
.sum p{font-size:17px}
.people{display:grid;gap:12px}
.person{display:flex;gap:16px;align-items:center;background:var(--surface);border-radius:18px;padding:14px 16px}
.person .disc{width:84px;height:84px}
.person b{display:block;font-family:var(--display);font-size:19px}
.person span{color:var(--mute);font-size:14px}
details{border:1px solid var(--line);border-radius:18px;padding:0 20px}
summary{cursor:pointer;list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;
  font-family:var(--display);font-weight:700;font-size:17px}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--c);font-size:20px}
details[open] summary::after{content:"－"}
.desc{padding:0 0 20px;font-size:15.5px}
.desc p+p{margin-top:1em}
.poster{background:var(--surface);border-radius:22px;padding:22px 20px;margin-top:30px}
.poster h2{font-size:21px;font-weight:700;margin-bottom:8px}
.stars{display:flex;gap:4px;margin:12px 0 2px}
.stars button{width:52px;height:52px;border:none;background:none;font-size:38px;line-height:1;padding:0;color:var(--line)}
.stars button.on{color:var(--star)}
.score{color:var(--mute);font-size:14px;min-height:1.8em}
.candy{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--bg);border-left:6px solid var(--c);font-weight:700}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.types{grid-template-columns:repeat(2,1fr)}}
.type{background:var(--bg);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px 8px 12px;
  border-radius:16px;border:2px solid var(--line);font-size:13.5px;line-height:1.5;font-weight:700;font-family:var(--display)}
.type:hover{border-color:var(--c)}
.hint{color:var(--mute);font-size:14px;margin:-4px 0 12px}
.browsebar{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
.mine{background:none;border:none;color:var(--accent);font-weight:700;min-height:48px;padding:8px 0;text-align:left;font-size:15px}
.endbtns .mine{text-align:center}
.type .disc{width:58px;height:58px;border-width:2px}
.type.me{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--bg))}
.type small{font-size:11.5px;color:var(--c)}
.endbtns{display:grid;gap:4px;padding:30px 0 46px}
.endbtns .link{text-align:center}
@media (prefers-reduced-motion:no-preference){
  .rfaces .disc{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
  .rfaces .disc+.disc{animation-delay:.12s}
  @keyframes pop{from{transform:scale(.6)}to{transform:none}}
}

/* ---- language switch (intro only, top right) ---- */
.langbar{display:flex;justify-content:flex-end;gap:2px;padding-top:14px}
.langbar button{background:none;border:none;color:var(--mute);font-size:13px;min-height:36px;min-width:44px;padding:4px 8px;border-radius:999px}
.langbar button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.langbar+.intro{padding-top:16px}
html[lang="en"] body{overflow-wrap:break-word;line-break:auto}
html[lang="en"] .intro h1 span{display:inline}
</style>
</head>

<main id="app"></main>
<script>
const T={
Q1:{q:`国家は個人の自由に積極的に介入し、経済的不平等を是正すべきだと思いますか？`,e:`最低賃金制度を例に考えてみましょう。この制度は、政府が定めた最低限度の賃金を企業に対して支払うことを義務づける制度です。この制度のもとでは、国家が労働市場に介入し、企業の賃金設定に制限を加えることになります。具体的には、企業は自分の判断で賃金を決定する自由を持たず、一定の最低賃金を支払わなければならなくなります。この制度には、企業の自由な経済活動や市場原理に反する部分もあります。他方で、低賃金で働く労働者が極端に低い賃金で生活しなければならない状況に対して、国家が一定の基準を設けることで、社会全体の公平性を保つことができるとも言えます。あなたは、この最低賃金制度が経済的不平等を解消するために必要な国家の介入だと考えますか？　それとも、自由な経済活動を守るために、国家の介入は控えるべきだと考えますか？`},
Q2:{q:`個人の福祉は、国家による所得の再配分（公助）よりも共同体との協力関係（共助）によって支えられるべきだと考えますか？`,e:`たとえば、「こども食堂」を考えてみましょう。多くの「こども食堂」は、地域住民やボランティアが協力して運営しています。つまり、共同体のメンバーが相互に助け合う形で成り立っています。 「こども食堂」には地域住民が直接関わり、子供たちに食事を提供するため、支援を受ける側と提供する側の間に密接なつながりがあります。一方、政府はより直接的かつ広範囲にわたって貧困問題に働きかけることができます。例えば、生活保護や児童手当などの社会保障制度を通じて、困窮している家庭に経済的支援を行うことができるでしょう。個人の福祉は共同体内での相互扶助に基づくべきだと主張されます。あなたは、個人の福祉が国家による所得の再配分（公助）で支えられるべきだと考えますか？　それとも、共同体との協力関係（共助）が個人の福祉にとって重要であると考えますか？　もちろん両者が相補的に機能することが望ましいですが、社会でより中心的な役割を果たすべきなのはどちらだと思いますか？`},
Q3:{q:`共同体の伝統や文化は、経済的な自由よりも重視されるべきだと思いますか？`,e:`たとえば、ある地域で行われている伝統的な祭りがあるとしましょう。この祭りは地域の歴史や文化を象徴しており、地元の人々が一丸となって運営しています。しかし、経済的自由を重視して外部からの観光業や商業施設が進出すると、観光客が増えて経済が潤う代わりに、祭りの本来の目的や地域性が損なわれる可能性があります。祭りの趣旨を理解せずに参加・見物する人も増えるかもしれません。この場合、地域の祭りをイベント化・商業化したり、新たにホテルを建設したりして、さらに地域経済を活性化させる方が望ましいでしょうか？　それとも、祭りの規模を抑えて、地域住民のみで行うことで文化的な純粋さを保つべきでしょうか？`},
Q4:{q:`市場原理がうまく機能する限り、経済的自由は重要だと思いますか？`,e:`例えば、高級住宅地と不動産市場を考えてみましょう。高級住宅地の不動産市場では、市場経済がうまく機能している限り、需要と供給に基づいて価格が決定されます。これによって富裕層は高級住宅を購入することができ、同じ社会・経済的な階層の人たちが集まるようになり、富裕層の多い地域とそうでない地域が発生するでしょう。この場合、市場原理はうまく機能していますが、社会的不平等は拡大し、地域間のギャップが広がることになります。それでは、政府は低中所得者のために住宅補助や住宅ローン控除などの税制優遇を提供したり、低所得層向けの住宅を一定割合確保することを高級住宅地に義務づけたりするべきでしょうか？`},
Q6:{q:`個人の選択が社会に悪影響を及ぼす可能性がある場合、国家は個人の自由や権利を制限しても介入すべきだと思いますか？`,e:`たとえば、高齢者の運転免許証の問題を考えてみましょう。連日、ニュースで高齢者による自動車運転をめぐる事故が報じられています。中には、高齢者から免許をとりあげるべきだ、より厳しいテストを課すべきだとの意見があります。他方で、交通網が整備されていない地域に暮らす高齢者にとって自動車が運転できなくなることは、（他の人たちには当たり前のように認められている）個人の権利が著しく制限されることになるでしょう。なお、代替となる交通網を整備するには予算も必要となり、過疎地域であれば採算が取れる可能性も少ないため、税金などで国民全体が負担する必要が出てきます。この場合、国家が個人の自由や権利を制限するような介入は認められるべきでしょうか？`},
Q8:{q:`国家全体の財政状況が厳しくなった場合も、全国民に対して最低限の医療や福祉サービスを維持するべきだと思いますか？`,e:`たとえば、日本における医療保険制度や生活保護制度は、国民が最低限の医療サービスや生活の支援を受けられる仕組みとして設計されていますが、このまま人口減少が続けば、これらのサービスをさらに縮小することが考えられます。最低限の医療や福祉サービスを維持するためには、税金の増加が避けられなくなり、特に低所得層にとっては経済的な圧力が強まる可能性があります。他方で、経済的な困難がある場合でも、最低限の福祉を提供することで全ての市民に基本的な権利を保障することができ、経済的に困窮している人々が健康を害したり、社会的な不安が広がったりするのを防ぐことができます。では、財政が逼迫する中でも最低限の医療や福祉サービスは維持すべきでしょうか？`},
Q11:{q:`国家の政策目標は、個人の権利や社会全体における効果を重視したものであるより、コミュニティで共有された価値観に沿ったものであるべきだと思いますか？`,e:`例えば、日本の小学校で道徳の授業が必修化されていますが、道徳の教科書では「集団の調和を乱さず、みんなと協力すること」が強調され、自己主張を抑えて協力することが望ましいとされています。しかし、このような日本の伝統的な価値観は、個人の権利や自由、また個人の創造性やイノベーションが社会全体にもたらす文化的・経済的な影響について十分に触れていないかもしれません。この場合、道徳の教科書はどちらの方向に沿った内容であるべきでしょうか？`}
};
/* セクション番号: [質問, はい→, いいえ→] */
const N={s1:['Q1','s2','s12'],s2:['Q2','s14','s3'],s3:['Q8','s4','s7'],s4:['Q11','s5','s6'],s7:['Q11','s5','s8'],s9:['Q4','s11','s10'],s11:['Q8','s6','s8'],s12:['Q6','s13','s16'],s13:['Q3','s9','s15'],s16:['Q2','s17','s18']};
const R={s5:'国家型コミュニタリアニズム',s6:'福祉国家型リベラリズム',s8:'功利主義的介入主義',s10:'マルクス主義',s14:'地域型コミュニタリアニズム',s15:'帰結主義的リバタリアニズム',s17:'保守的自由主義',s18:'自然権的リバタリアニズム'};
const B={
s6:`ジョン・ロールズ（1921-2002）が著書『正義論』(1971)において提起した立場であり、20世紀の政治哲学に一石を投じた。この著作は、マイケル・サンデル(1953-)やロバート・ノージック(1938-2002)からも、その思想的な違いにもかかわらず高く評価される。
この立場は、国家による福祉制度の強化と、所得再配分を通じた平等の実現を目指している。特徴的なのは「無知のヴェール」という概念だ。ロールズによれば、理想の正義や制度を考える時、誰しも自らの立場（ジェンダー・富・才能・体力・人種など）に縛られて自分に有利になるような制度を選択してしまうため、全員が平等な市民である社会における合理的な制度は採択されない。そこで、ロールズは、「無知のヴェール」を各人にかぶせて自分の社会的・経済的立場がわからない状態で理想の正義や制度を考えさせるという仮説を設定した。この状態であれば、全ての人が「自分は抑圧されている少数派かもしれない」と考えて最も恵まれない人たちに有利な（より平等な）制度を選択すると結論づけた。よって、全ての人に最低限の基本的自由が平等に与えられるべきであり、最も不遇な立場の人の利益になるような格差のみ制度として認められるべき（格差原理）だと主張した。
「無知のヴェール」はあくまでも理論的な仮説だが、もう少し身近な例として火災保険を考えてみよう。もし自分の家が火事に遭わないことを知っていたら、誰も火災保険に加入しないだろう。つまり、火災保険に加入することは、無意識のうちに自分の家が火事に遭うという最悪の状態を想定していることを意味するのだ。そして、罹災者という最も不遇な立場の人のために、多くの人が保険料を毎月納めているのである。これと同じく、「無知のヴェール」を被った状態であれば、自分も最も恵まれないグループに陥る可能性を重視して、より平等な社会構造に同意するはずだ、とロールズは考えたのである。`,
s10:`資本主義体制そのものの克服を目指す点で、他の思想的立場と大きく異なるのがマルクス主義である。その代表的思想家は、『資本論』（1867年、第1巻刊行）を著したカール・マルクス（1818–1883）と、その盟友フリードリヒ・エンゲルス（1820–1895）である。マルクスによれば、資本主義とは、生産手段を所有する資本家が、労働力を商品として売る労働者から剰余価値を取得することによって成り立つ経済体制である。剰余価値とは、労働者が生み出した価値のうち、労働力の価値（賃金に対応する部分）を超える部分を指す。マルクス主義は、こうした「搾取」を資本主義に内在する構造的問題と捉え、階級闘争を通じて資本主義を克服し、最終的には階級対立や国家による支配が解消された共産主義社会の実現を目指す。
もっとも、資本主義が存続する間も、労働者の生活条件を改善するための改革を否定するわけではない。例えば、労働時間の短縮、労働環境の改善、労働者の健康や安全の保障などは、労働者の権利を拡大し、階級的な力関係を変化させる取り組みとして支持され得る。ただし、こうした改革のみで資本主義の構造的矛盾が解消されるとは考えない。
また、マルクス主義の影響を受けた従属理論などは、資本主義的な搾取関係が国際経済にも存在すると論じる。例えば、途上国が低付加価値の一次産品などを輸出する一方、先進国が高付加価値の工業製品を輸出するという国際分業の構造は、途上国の経済的従属を固定化し、南北間の格差を再生産する要因になり得る。
こうした構造的不平等を是正するため、マルクス主義は、生産手段の私的所有を相対化し、富や経済的権力の集中を解消することを目指す。例えば、1917年のロシア革命後、レーニン率いるボリシェヴィキ政権は「土地に関する布告」を公布し、大地主による土地所有を廃止して、土地を農民の利用に委ねた。これは、土地所有に基づく階級的支配を解消し、農民の経済的平等を実現しようとする改革であった。実際に大地主の土地所有は解体されたが、その後、スターリン政権下で進められた農業集団化は、農民への強制や深刻な飢饉を伴った。この事例は、生産手段の私的所有を解体することが必ずしも経済的平等につながるわけではなく、国家に権力が集中すれば、新たな抑圧や不平等を生み出す危険性があることを示している。しかし、マルクスの思想の意義は、必ずしも彼が構想した社会主義革命の実現可能性だけにあるのではない。むしろ、資本主義社会において、資本の所有者と労働者の間に構造的な権力の不均衡が存在し、経済的な格差が再生産される仕組みを批判的に捉えた点にある。したがって、社会主義革命が当初の構想どおりに実現しなかったとしても、資本主義における富と権力の集中や、それに伴う構造的不平等を問い直す思想として、マルクスの批判は現代においても重要な意味を持つ。`,
s18:`８つの立場のうち、自然権的リバタリアニズムと帰結主義的リバタリアニズムは、どちらもリバタリアニズム（自由至上主義）と呼ばれる立場を共有している。リバタリアニズムとは、他者の自由を損ねないかぎりにおいて、個人の自由を最大限尊重する思想上の立場である。ロバート・ノージック（1938－2002）が『アナーキー・国家・ユートピア』（1974）で、洗練された体系として示したとされている。二つの立場の違いは、「なぜ自由が大切なのか」という問いへの答えにある。帰結主義的リバタリアンは、社会に良い結果をもたらすから自由を大切だと考える。これに対して自然権的リバタリアンは、自由そのものが守られるべき権利だと考える。
自然権的リバタリアンにとって、人は生まれながらに、自分の身体と、それを使って正当に手に入れた財産を自由にする権利（自然権）をもっている。この権利は、たとえ社会全体の利益のためであっても侵されてはならない。たとえば、いまのところ日本では、ドラッグの売買・使用・所持は禁止されている。ところが、自然権的リバタリアンならば、ドラッグの使用や販売も個人の自由として認める。あなたの身体は、ほかならぬあなたのものである。したがって、あなたが自身の判断でドラッグを使用して中毒になっても、他人の身体・財産・自由を侵害しないかぎり、それはあなたの自由な選択として認められる（これを、愚かなことをする権利という意味で「愚行権」という）。
また、自然権的リバタリアンは、政府の役割をできるかぎり小さくしておきたいと考える。政府に許されるのは、暴力や盗み、詐欺から人々の権利を守り、契約を守らせることだけである（最小国家、夜警国家）。国鉄や郵政はもちろん、水道も民営化されるべきだと主張するだろう。国民健康保険も年金制度も不要だ。ノージックは、所得への課税によって人の労働の成果を取り上げることは、強制労働と変わらないとまで述べている。ここまでの例だけを見ると、ネガティブな印象を持たれるかもしれない。しかし、リバタリアンの想定する世界では、わずらわしい規制も存在しなくなり、言論の自由もきわめて広く保障される。この考えを極端に推し進めると、マレー・ロスバード（1926－1995）のように、国家の存在さえ否定するアナルコ・キャピタリズム（無政府資本主義）の立場に至る。`,
s15:`帰結主義的リバタリアンは、自然権的リバタリアンと同じくリバタリアニズムの立場をとりながら、その根拠を「自由がもたらす帰結（結果）」に求める。社会全体を豊かにし、人々の暮らしを良くするための最良の手段が、自由市場であり個人の自由だと考えるのである。では、なぜ自由市場が良い結果を生むのか。フリードリヒ・ハイエク（1899－1992）は、社会に必要な知識は無数の人々のあいだに散らばっており、政府がそれをすべて把握して計画することはできないと論じた。市場の価格は、そうした散らばった知識を人々に伝える仕組みとして働く。ミルトン・フリードマン（1912－2006）もまた、政府の規制や裁量的な政策は、しばしば意図に反する悪い結果を生むと主張した。
ただし、この立場は「結果」を基準にするため、自由放任が明らかに悪い結果を招く場合には介入を認める。その判断は、介入によって得られる便益と、介入にかかる費用の比較によって行われる。具体例として、フリマアプリ「メルカリ」を考えてみよう。出品者と購入者は互いの合意のうえで自由に取引しており、基本的には第三者が介入する理由はない。では、詐欺を防ぐために、政府が法律ですべての利用者に本人確認を義務付けるべきだろうか。帰結主義的リバタリアンは、詐欺が減るという便益と、利用の手間、個人情報漏洩のリスク、気軽な取引の萎縮といった費用を比べて判断する。費用のほうが大きいと見込まれるなら反対するだろう。ここで注目したいのは、反対の理由が「自由を侵害するから」ではなく「割に合わないから」だという点である。したがって、条件が変われば結論も変わりうる。自由を侵してはならない権利と考える自然権的リバタリアンとの違いは、まさにここにある。
この柔軟さは、代表的な論者の提案にも表れている。フリードマンは、所得が一定額に満たない人に給付を行う「負の所得税」や、教育バウチャー（学校を選べる利用券）を提案した。どちらも、市場の仕組みを活かしながら政府が一定の役割を果たす政策である。ハイエクも『隷属への道』（1944）で、最低限の生活保障までは否定しなかった。こうしたハイエクとフリードマンの思想は、英国首相マーガレット・サッチャーや米国大統領ロナルド・レーガンが推し進めた、規制緩和や民営化を中心とする経済政策に大きな影響を与えた。`,
s8:`他の7つの思想的な立場に比べると、功利主義的介入主義はそれほど確立した立場ではない。だが、非日常的な事態が発生したときに説得力を増す立場である。
まず功利主義という点では、他の7つの立場のうちの1つである「帰結主義的リバタリアン」と思想的な根拠は同じである。功利主義とは「最大多数の最大幸福」を目指す（結果としての最大多数の幸福を究極目標とする）立場であり、平等や人権といった抽象的な理念を前提にしていない。自由を理想として掲げるリバタリアンの中にも、「そうすることが結果として全体の福利に貢献するから」と考えるなら、帰結主義的リバタリアンとなる。
だが、この「帰結主義」（結果によって判断する）という考え方は、社会全体の利益を実現するなら個人の自由や権利への（場合によっては大幅な）介入も正当化することになる。こちらの側面が色濃く出ているのが、功利主義的介入主義である。
最もわかりやすい例はコロナ禍におけるロックダウンである（そのほかにも、結核患者は隔離入院の対象であり、個人の自由が大幅に制限されることが今も合法化されている）。事後的に考えれば「ロックダウンもやむを得なかった」と考える人もいるだろうが、まだコロナの致死率や感染力がわからない状況ではどう判断すべき（だった）だろうか。マスク着用をかたくなに拒否する一部の人たちが抗議行動をしていたアメリカのような国においても、個人の自由を法的に制限すべきだと判断するのがこの立場である。
この立場をとる人たちは、全体主義者というわけではないので、平時の自由な経済活動には寛容だが、個々人の自由や権利主張の行き過ぎによって生じる問題や軋轢（ex.マスク着用を拒否する人たちの抗議行動）に敏感である。とはいえ（コミュニタリアンとは異なり）国家や地域的な慣習や伝統に訴えかけることで問題を解決しようとは考えない。たとえばアルコール依存症者やギャンブル依存症者が多いのであれば、伝統的に飲酒や賭博が文化の一部として根付いている国や地域であってもアルコール販売やギャンブルを法的に規制すればよい、と判断するだろう。
功利主義の創始者であるイギリスの思想家ジェレミー・ベンサム（1748–1832）は、基本的には個人の自由を奨励したが、貧困問題を解決するためには、貧困者を特別な施設に集めて規律ある生活態度を身につけさせるべきだと主張した。`,
s17:`他の7つの思想的立場と比較すると、保守的自由主義は社会の安定や秩序の維持を重視する点で、自由主義の一種でありながら、比較的穏健で現実的な立場をとる。保守的自由主義とは、個人の自由を尊重しつつ、伝統や社会の安定にも価値を置く思想である。つまり、自由主義と保守主義の調和を図り、個人の権利を保障しながらも、長い歴史の中で形成された制度や慣習を維持することを重視する。
歴史的には、エドマンド・バーク（1729–1797）の思想がその源流の一つとされる。バークはフランス革命による急進的な社会変革を批判した一方、アメリカ植民地に対するイギリス政府の強硬政策にも反対し、植民地側との和解を主張した。また、経済思想においては、自由な市場や分業の重要性を説いたアダム・スミス（1723–1790）と共通する考え方も持っていた。スミスは、市場における個人の利益追求が、一定の条件下で社会全体の利益にもつながり得ることを論じた。バークも経済的自由を重視したが、同時に、既存の秩序や慣習を急激に破壊することには慎重であった。こうした姿勢には、自由を守るためにも歴史的に形成された制度や社会的な結びつきが必要だという保守的自由主義の特徴が表れている。
具体例として、教育制度の改革や経済活動への規制が挙げられる。保守的自由主義の立場では、教育制度を改革する際にも、地域社会の伝統や既存の制度を尊重し、急激な変更には慎重になると考えられる。また、経済活動については、企業の自由や市場競争を基本的に支持しつつ、独占の防止や市場秩序の維持に必要な規制は容認し得る。したがって、一方では、経済的自由を尊重する点ではリバタリアニズムに近いものの、社会的安定のための一定の政府介入は認める。他方で、伝統や共同体の価値を尊重する点ではコミュニタリアニズムとも共通するが、後者が価値観や道徳的判断における共同体の役割を侵食する市場経済に批判的であるのに対して、保守的自由主義は自由主義的な制度や市場経済の維持に比較的重点を置く。また、福祉国家型リベラリズムと比べると、所得再分配や福祉制度の拡充による平等の実現には慎重な傾向がある。`,
s5:`国家型コミュニタリアニズムは、共同体の価値観や国家の一体性を重視し、個人の自由と社会的責任の調和を図ることを目指す。この立場は地域型コミュニタリアニズムと共通点を持ちながらも、全国的な一体性と共同体意識を強調する。地域型コミュニタリアニズムが地域社会の独自の伝統や価値観に基づく問題解決を重視する一方で、国家型コミュニタリアニズムは国全体で統一する傾向にある。
例えば同性婚などの問題に関して、キリスト教やイスラム教などが根強い国では、同性婚を認めることでどれだけ社会的幸福が増大したとしても、伝統や文化の存続に関わるため認めないだろう。また、一部地域の特殊な文化が一国全体の価値観と矛盾する場合にも、後者をより重視する。
教育についても、国家的コミュニタリアニズムは公立学校が人格的能力を育成する場であるべきだと考え、カリキュラムに道徳教育を導入することに積極的である。日本の小中学校でも数年前から道徳の授業が必修化されており、学校が社会の一員としての行動や考え方を育むべき場と考えられている。宗教教育や性教育に関しても、個人の自由の行き過ぎを防ぎ、共通善とのバランスを追求する。特に公共の安全において、個人が社会の一員として協力することが求められる。
この思想を代表するアメリカの社会学者アミタイ・エツィオーニ（1929-2023）は、「新しい黄金律」を提唱している。従来の黄金律（「あなたが他者からしてもらいたいことを、他者にしてあげなさい」）が人と人との直接の関係であるのに対し、彼の掲げる「新しい黄金律」は、「あなたの自律を尊重し支持してほしいと願うように、社会の道徳秩序を尊重し支持しなさい」と提案し、個人の自由と社会的な責任の両立を目指している。個人の自由や自律を否定するのではなく、公共の福祉との調和を重視するのだ。`,
s14:`コミュニタリアニズムは共同体によって共有される価値観を重んじる考え方であり、「ハーバード白熱教室」でも有名なアメリカの政治哲学者マイケル・サンデル（1953-）が代表的な論者だ。この思想は「人は共同体（コミュニティ）とのつながりの中で生きている」という前提に基づき、個人の自由も重要だが、それと同時に家族・地域との関係や共同体全体の幸福を考える必要があることを強調している。
「地域型コミュニタリアニズム」と「国家型コミュニタリアニズム」は、どちらも共同体の価値観や文化を重視するという点で共通するが、「地域型コミュニタリアニズム」が考える共同体の範囲は地域・地方自治体・都市などの小規模なものであり、市民である私たち一人ひとりが関わっていることが特徴である。グローバル化が進む現代において、ローカルな文化やアイデンティティの維持に重要な意味を持つ。
具体例として、フランスの「エヴァン法」をめぐる論争が挙げられる。この法律は、人々の健康のために国内におけるテレビや映画でのアルコール広告を禁止する法律であるが、昔からワインを生産しているボルドー地方などのワイン農家が反発して問題となっている。国家レベルで健康問題に取り組むことは重要だが、ワイン作りという地方の伝統文化や独自性を守ることも重視すべきだという主張は地域型コミュニタリアニズムの考えを表す事例だろう。
サンデルは、「人は他の人々や自分が属する共同体とつながり、そこから影響を受ける存在である」と考えている。つまり、私たちの価値観や考え方は、自分が属している共同体の歴史や文化の影響を強く受けているのだ。このため、個人の自由や権利だけを重視するのではなく、社会全体が共有する「みんなの幸福」や「公共の善」についても考えなければならない、とサンデルは主張している。市場原理の過度な浸透による経済的格差の拡大を警戒する点では福祉国家型リベラリズムと共通する面もあるが、地域型コミュニタリアニズムは個人と国家の中間に位置する共同体を重視する点で、国家の過度な介入に批判的である。`

const S={"s18": "自然権的リバタリアニズムは、人は生まれながらに自分の身体と財産を自由にする権利をもつと考え、その権利を何よりも重んじる立場である。たとえ社会全体の得になるとしても、本人の同意なく自由や財産を奪うことは許されない。政府の役割は、暴力や盗み、詐欺から人々を守ることだけに限るべきだとされる（最小国家）。そのため、年金や公的保険、多くの規制は不要とされる。臓器売買のような選択も、他人を害さないかぎり個人の自由として認められる。代表的な論者はロバート・ノージックであり、その先には国家そのものを否定するロスバードのアナルコ・キャピタリズムなどがある。", "s15": "帰結主義的リバタリアニズムは、個人の自由を最大限尊重するリバタリアニズムの一派でありながら、その根拠を「自由がもたらす良い結果」に求める立場である。自由な市場では、無数の人々がそれぞれの知識をもとに取引する。そのほうが、政府が計画するよりも効率よく社会全体を豊かにすると考えるため、規制や政府の介入には基本的に反対する。ただし、自由放任が明らかに悪い結果を招くなら話は別だ。その場合は費用と便益を比べ、市場がうまく働くための最小限の介入を認める。代表的な論者は経済学者のハイエクとフリードマンであり、レーガン政権やサッチャー政権の経済政策にも影響を与えた。", "s10": "マルクスとエンゲルスに代表されるマルクス主義は、資本家が労働者の生み出す剰余価値を搾取する構造を批判し、階級闘争を通じた資本主義の克服と共産主義社会の実現を目指す。労働時間の短縮や労働環境の改善も支持するが、改革だけでは構造的矛盾は解消されないと考える。こうしたマルクス主義の現代的展開として、資本主義批判を環境問題にも結びつけた「脱成長コミュニズム」の議論（斎藤幸平など）もある。また、この考えを国際関係に適用した「従属理論」は、国際分業が途上国の従属と南北格差を再生産すると論じる。", "s17": "保守的自由主義は、個人の自由や市場経済を尊重しつつ、伝統や社会秩序の維持を重視する思想である。代表的思想家のエドマンド・バークは、フランス革命の急進的変革を批判し、歴史的に形成された制度や慣習の重要性を説いた。具体的には、教育改革において地域の伝統や既存制度を尊重し、急激な変更を避けようとする。また、市場競争を支持しつつも、独占防止など秩序維持に必要な規制は容認する。この点で、政府介入を極力排するリバタリアニズムとは異なる。また、共同体の道徳的役割を重視するコミュニタリアニズムに対し、自由主義的制度の維持を重視する。福祉国家型リベラリズムと比べ、再分配や福祉拡充には慎重であり、自由と社会的安定の両立を目指す。", "s6": "ロールズが『正義論』(1971)で提起した立場で、福祉制度の強化と所得再配分による平等の実現を目指す。特徴は「無知のヴェール」という概念である。人は自分の性別や富、才能、人種などに縛られ、自分に有利な制度を選びがちである。そこで、自分の社会的・経済的立場がわからない状態で制度を考えさせると、誰もが「自分は最も恵まれない側かもしれない」と想定し、より平等な制度を選ぶとロールズは論じた。結論として、全ての人に基本的自由が平等に保障されるべきであり、格差は最も不遇な人の利益になる場合に限って認められることになる。", "s8": "功利主義的介入主義は、他の立場に比べて確立してはいないが、非日常的な事態が発生した際に説得力を増す立場である。思想的根拠は帰結主義的リバタリアンと同じ功利主義で、平等や人権といった理念ではなく、結果としての最大多数の幸福を究極目標とする。ただし帰結主義は、社会全体の利益になるなら個人の自由や権利への大幅な介入も正当化するため、この側面を強く打ち出すのが功利主義的介入主義である。典型例はコロナ禍のロックダウンで、マスク拒否の抗議が起きた米国でも法的制限を支持する。平時の自由な経済活動には寛容だが、自由の行き過ぎによる軋轢には敏感である。", "s14": "コミュニタリアニズムとは、人間を共同体の中でアイデンティティが形成される存在と捉え、個人の権利よりも共通善を重視する考え方である。代表的な論者であるサンデルは、リバタリアニズムやロールズが前提とする人間観を「負荷なき自我」と呼んで批判した。地域型コミュニタリアニズムは、地域・地方自治体・都市など、市民一人ひとりが関わる小規模な共同体を重視し、グローバル化の中でローカルな文化やアイデンティティを守る意義を強調する。フランス政府が健康政策として酒類広告禁止を打ち出したのに対して、ボルドーのワイン農家が反発した例はその典型である。市場原理による格差拡大を警戒する点では福祉国家型リベラリズムと重なるが、国家の過度な介入には批判的である。", "s5": "国家型コミュニタリアニズムとは、共同体の価値観と国家の一体性を重視し、個人の自由と社会的責任の調和を目指す立場である。共同体を重んじる点で地域型コミュニタリアニズムと共通するが、地域ごとの伝統に基づく解決よりも、国全体で統一された価値観や共同体意識を優先する。\nたとえば宗教的伝統の根強い国では、同性婚が社会的幸福を増やすとしても、伝統や文化の存続を理由に認めない傾向がある。教育では公立学校を人格形成の場とみなし、道徳教育の導入に積極的である。\n代表的論者であるエツィオーニは「新しい黄金律」として、自らの自律を尊重してほしいと願うのと同じように社会の道徳秩序を尊重せよと説き、秩序と自律のバランスを重視した。"};

Q1:{q:`Should the state actively intervene in individual freedom to correct economic inequality?`,e:`Take the minimum wage as an example. It obliges companies to pay at least a minimum wage set by the government. Under this system, the state intervenes in the labor market and restricts how companies set wages: companies can no longer decide wages freely and must pay at least the set minimum. In part, this runs against free economic activity and market principles. On the other hand, by setting a standard for workers who would otherwise have to live on extremely low wages, the state can be said to keep society as a whole fairer. Do you think the minimum wage is a state intervention needed to reduce economic inequality? Or should the state hold back in order to protect free economic activity?`},
Q2:{q:`Should individual welfare be supported more by cooperation within the community (mutual aid) than by the state's redistribution of income (public assistance)?`,e:`Consider, for example, Japan's kodomo shokudō, community cafeterias that serve meals to children. Many are run jointly by local residents and volunteers; in other words, they rest on members of the community helping one another. Because local residents are directly involved in feeding the children, there is a close bond between those who give support and those who receive it. The government, by contrast, can tackle poverty more directly and on a wider scale. For instance, it can give financial support to struggling households through social security programs such as public assistance and child allowances. Some argue that individual welfare should rest on mutual aid within the community. Do you think individual welfare should be supported by the state's redistribution of income (public assistance)? Or do you think cooperation with the community (mutual aid) matters more for individual welfare? Ideally the two complement each other, but which should play the more central role in society?`},
Q3:{q:`Should a community's traditions and culture be valued more than economic freedom?`,e:`Suppose a region holds a traditional festival. It symbolizes the area's history and culture, and local people run it together. But if, in the name of economic freedom, outside tourism businesses and commercial facilities move in, more tourists may boost the local economy while the festival's original purpose and local character could be lost. More people might also join or watch without understanding what the festival is about. In this case, is it better to turn the festival into a commercial event or build new hotels to energize the local economy further? Or should the festival be kept small and run only by local residents to preserve its cultural purity?`},
Q4:{q:`As long as market mechanisms work well, is economic freedom important?`,e:`Consider upscale residential areas and the real-estate market. As long as the market economy works well, prices in the luxury housing market are set by supply and demand. Wealthy people can then buy high-end homes, people of the same social and economic class gather together, and areas with many wealthy residents and areas without them emerge. Here the market is working well, yet social inequality grows and the gap between areas widens. Should the government, then, offer low- and middle-income households housing subsidies or tax breaks such as mortgage deductions, or require upscale areas to set aside a certain share of housing for low-income people?`},
Q6:{q:`If an individual's choices could harm society, should the state intervene even if it restricts individual freedom and rights?`,e:`Consider driver's licenses for older people. Accidents involving elderly drivers are reported in the news almost every day. Some say older people's licenses should be taken away, or that they should face stricter tests. On the other hand, for older people living in areas without good public transport, being unable to drive would severely restrict a right that everyone else takes for granted. Building alternative transport would also cost money, and since it is unlikely to pay for itself in depopulated areas, the public as a whole would have to bear the cost through taxes. In this case, should the state be allowed to intervene in ways that restrict individual freedom and rights?`},
Q8:{q:`Even if the nation's finances become strained, should a minimum level of medical and welfare services be maintained for everyone?`,e:`Japan's health insurance and public assistance systems, for example, are designed so that people can receive minimum medical care and support for daily living. But if the population keeps shrinking, these services may be cut back further. Maintaining minimum medical and welfare services would make tax increases unavoidable, which could put more economic pressure on low-income households in particular. On the other hand, providing minimum welfare even in hard economic times guarantees basic rights to all citizens, and can keep people in financial difficulty from losing their health and stop social anxiety from spreading. So should minimum medical and welfare services be maintained even when public finances are tight?`},
Q11:{q:`Should national policy goals follow the values shared by the community, rather than focusing on individual rights or the effects on society as a whole?`,e:`For example, moral education is a required subject in Japanese elementary schools, and the textbooks stress "not disturbing the harmony of the group and cooperating with everyone," presenting restraint of self-assertion in favor of cooperation as desirable. However, such traditional Japanese values may not say enough about individual rights and freedom, or about the cultural and economic effects that individual creativity and innovation bring to society as a whole. In this case, which direction should moral education textbooks follow?`}

s18:`Natural-rights libertarianism holds that people are born with the right to their own bodies and property, and values that right above all. Taking someone's freedom or property without their consent is not allowed, even if society as a whole would gain. The government's role should be limited to protecting people from violence, theft and fraud (the minimal state). Pensions, public insurance and most regulations are therefore seen as unnecessary. Even a choice like selling one's own organs is accepted as personal freedom, as long as it harms no one else. Its leading thinker is Robert Nozick; further along lies Rothbard's anarcho-capitalism, which rejects the state altogether.`,
s15:`Consequentialist libertarianism is a branch of libertarianism, which respects individual freedom as far as possible, but it grounds that freedom in the good results it brings. In a free market, countless people trade using their own knowledge. Believing this makes society richer more efficiently than government planning, it generally opposes regulation and government intervention. But if laissez-faire clearly leads to bad outcomes, things are different: it weighs costs against benefits and accepts the minimum intervention needed for markets to work. Its leading thinkers are the economists Hayek and Friedman, who influenced the economic policies of the Reagan and Thatcher governments.`,
s10:`Marxism, represented by Marx and Engels, criticizes the structure in which capitalists exploit the surplus value that workers create, and aims to overcome capitalism through class struggle and build a communist society. It supports shorter working hours and better working conditions, but believes reforms alone cannot resolve capitalism's structural contradictions. A modern development of Marxism is "degrowth communism" (Kohei Saito and others), which links the critique of capitalism to environmental problems. Dependency theory, which applies this thinking to international relations, argues that the international division of labor reproduces developing countries' dependence and the North–South gap.`,
s17:`Conservative liberalism respects individual freedom and the market economy while emphasizing the preservation of tradition and social order. Its representative thinker, Edmund Burke, criticized the radical changes of the French Revolution and stressed the importance of institutions and customs formed over history. In practice, it respects local traditions and existing institutions in education reform and avoids sudden change. It supports market competition while accepting the regulations needed to maintain order, such as preventing monopolies. In this it differs from libertarianism, which rejects government intervention as far as possible. Compared with communitarianism, which emphasizes the moral role of the community, it puts more weight on preserving liberal institutions. Compared with welfare-state liberalism, it is cautious about redistribution and expanding welfare, aiming to balance freedom with social stability.`,
s6:`This position was put forward by Rawls in A Theory of Justice (1971) and aims to achieve equality through stronger welfare systems and income redistribution. Its hallmark is the "veil of ignorance." People tend to be bound by their own gender, wealth, talents, race and so on, and to choose institutions that favor themselves. Rawls argued that if people design institutions without knowing their own social and economic position, everyone will assume "I might be among the worst off" and choose more equal institutions. The conclusion: basic liberties should be guaranteed equally to everyone, and inequalities are acceptable only when they benefit the least advantaged.`,
s8:`Utilitarian interventionism is less established than the other positions, but it gains persuasive power when extraordinary situations arise. Its philosophical basis is the same utilitarianism as consequentialist libertarianism: its ultimate goal is the greatest happiness of the greatest number as an outcome, not ideals such as equality or human rights. But consequentialism also justifies sweeping intervention in individual freedom and rights if it benefits society as a whole, and utilitarian interventionism puts this side front and center. A typical example is the COVID-19 lockdowns: it supports legal restrictions even in a country like the US, where people protested against wearing masks. It is tolerant of free economic activity in normal times, but sensitive to the friction caused by too much freedom.`,
s14:`Communitarianism sees people as beings whose identities are formed within communities, and values the common good over individual rights. Its leading thinker, Sandel, criticized the view of the person assumed by libertarianism and by Rawls as the "unencumbered self." Local communitarianism focuses on small communities that each citizen takes part in, such as neighborhoods, local governments and cities, and stresses the importance of protecting local culture and identity amid globalization. A typical example is the backlash of Bordeaux wine growers against the French government's ban on alcohol advertising, introduced as a health policy. It shares welfare-state liberalism's wariness of inequality driven by market forces, but is critical of excessive state intervention.`,
s5:`National communitarianism values shared community values and national unity, aiming to harmonize individual freedom with social responsibility. It shares local communitarianism's respect for community, but gives priority to values and a sense of community unified across the whole nation over solutions based on each region's traditions.
For example, in countries with strong religious traditions, it tends not to accept same-sex marriage, citing the survival of tradition and culture, even if it would increase social happiness. In education, it sees public schools as places for building character and is keen to introduce moral education.
Its representative thinker, Etzioni, proposed a "new golden rule": respect and uphold society's moral order as you would have society respect and uphold your autonomy. He stressed the balance between order and autonomy.`

s6:`This is the position put forward by John Rawls (1921–2002) in A Theory of Justice (1971), a book that made waves in 20th-century political philosophy. It is highly regarded even by Michael Sandel (1953–) and Robert Nozick (1938–2002), despite their philosophical differences.
This position aims to strengthen state welfare systems and achieve equality through income redistribution. Its distinctive feature is the concept of the "veil of ignorance." According to Rawls, when people think about ideal justice and institutions, everyone is bound by their own position (gender, wealth, talent, physical strength, race and so on) and chooses institutions that benefit themselves, so the rational institutions of a society of equal citizens are never adopted. Rawls therefore set up a hypothesis in which each person wears a "veil of ignorance" and must think about ideal justice and institutions without knowing their own social and economic position. He concluded that in this state everyone would think "I might be part of an oppressed minority" and choose institutions that favor the least advantaged, that is, more equal ones. He therefore argued that everyone should be given equal basic liberties, and that only those inequalities that benefit the least advantaged should be permitted (the difference principle).
The "veil of ignorance" is only a theoretical hypothesis, but consider a more familiar example: fire insurance. If you knew your house would never catch fire, you would not buy fire insurance. In other words, buying fire insurance means unconsciously imagining the worst case, your own house burning down. And many people pay premiums every month for the sake of those in the worst position, the fire victims. In the same way, Rawls thought that behind the "veil of ignorance" people would take seriously the chance of ending up in the least advantaged group, and would agree to a more equal social structure.`,
s10:`Marxism differs greatly from the other positions in that it aims to overcome the capitalist system itself. Its representative thinkers are Karl Marx (1818–1883), author of Capital (vol. 1 published in 1867), and his ally Friedrich Engels (1820–1895). According to Marx, capitalism is an economic system in which capitalists, who own the means of production, extract surplus value from workers who sell their labor power as a commodity. Surplus value is the part of the value created by workers that exceeds the value of their labor power (the part corresponding to wages). Marxism sees this "exploitation" as a structural problem built into capitalism, and aims to overcome capitalism through class struggle and, ultimately, to realize a communist society in which class conflict and domination by the state have disappeared.
That said, it does not reject reforms that improve workers' living conditions while capitalism continues. Shorter working hours, better working environments and guarantees of workers' health and safety, for example, can be supported as efforts that expand workers' rights and shift the balance of class power. However, it does not believe such reforms alone can resolve capitalism's structural contradictions.
Dependency theory and other approaches influenced by Marxism also argue that capitalist relations of exploitation exist in the international economy. For example, an international division of labor in which developing countries export low-value-added primary goods while developed countries export high-value-added manufactured goods can lock in developing countries' economic dependence and reproduce the gap between North and South.
To correct such structural inequality, Marxism aims to relativize private ownership of the means of production and break up concentrations of wealth and economic power. For example, after the Russian Revolution of 1917, the Bolshevik government led by Lenin issued the Decree on Land, abolishing ownership by large landlords and handing the land over to the peasants' use. This was a reform meant to end class domination based on landownership and achieve economic equality for peasants. Large landed estates were indeed broken up, but the later collectivization of agriculture under Stalin involved coercion of peasants and severe famine. This case shows that dismantling private ownership of the means of production does not necessarily lead to economic equality, and that concentrating power in the state risks creating new oppression and inequality. Yet the significance of Marx's thought does not lie only in whether the socialist revolution he envisioned could be achieved. Rather, it lies in his critical analysis of how capitalist society contains a structural imbalance of power between owners of capital and workers, and how economic inequality is reproduced. So even though socialist revolutions did not turn out as originally envisioned, Marx's critique remains important today as a way of questioning the concentration of wealth and power under capitalism and the structural inequality that comes with it.`,
s18:`Of the eight positions, natural-rights libertarianism and consequentialist libertarianism both share the stance called libertarianism. Libertarianism is the position that respects individual freedom as far as possible, so long as it does not harm the freedom of others. Robert Nozick (1938–2002) is said to have presented it as a refined system in Anarchy, State, and Utopia (1974). The difference between the two positions lies in how they answer the question "why does freedom matter?" Consequentialist libertarians value freedom because it brings good results for society. Natural-rights libertarians, by contrast, see freedom itself as a right that must be protected.
For natural-rights libertarians, people are born with the right (a natural right) to control their own bodies and the property they have legitimately acquired with them. This right must not be violated, even for the benefit of society as a whole. For example, buying, selling, using and possessing drugs is currently banned in Japan. A natural-rights libertarian, however, would accept using and selling drugs as individual freedom. Your body belongs to no one but you. So even if you use drugs by your own decision and become addicted, as long as you do not violate other people's bodies, property or freedom, it must be accepted as your free choice (this is called the "right to do foolish things").
Natural-rights libertarians also want to keep the government's role as small as possible. All the government may do is protect people's rights against violence, theft and fraud, and enforce contracts (the minimal state, or "night-watchman state"). They would argue that not only national railways and the postal service but even water supply should be privatized. National health insurance and pensions are unnecessary too. Nozick went so far as to say that taking the fruits of people's labor through income tax is no different from forced labor. Looking only at these examples, you may get a negative impression. But in the world libertarians imagine, burdensome regulations disappear and freedom of speech is guaranteed very broadly. Pushed to the extreme, this idea leads to anarcho-capitalism, which denies even the existence of the state, as advocated by Murray Rothbard (1926–1995).`,
s15:`Consequentialist libertarians take the libertarian position just as natural-rights libertarians do, but they ground it in "the consequences (results) that freedom brings." They believe free markets and individual freedom are the best means of making society richer and improving people's lives. So why do free markets produce good results? Friedrich Hayek (1899–1992) argued that the knowledge a society needs is scattered among countless people, and that no government can grasp it all and plan accordingly. Market prices work as a mechanism for passing that scattered knowledge on to people. Milton Friedman (1912–2006) also argued that government regulation and discretionary policy often produce bad results contrary to their intentions.
However, because this position judges by results, it accepts intervention when laissez-faire clearly leads to bad outcomes. That judgment is made by comparing the benefits of intervening with its costs. Take the flea-market app Mercari as an example. Sellers and buyers trade freely by mutual agreement, so there is basically no reason for a third party to step in. Should the government, then, legally require every user to verify their identity in order to prevent fraud? A consequentialist libertarian would compare the benefit of less fraud with costs such as the extra hassle, the risk of personal data leaks and a chilling effect on casual trading. If the costs look larger, they would oppose it. Note that the reason for opposing it is not "it violates freedom" but "it isn't worth it." So if conditions change, the conclusion can change too. This is exactly where they differ from natural-rights libertarians, who see freedom as a right that must not be violated.
This flexibility shows in the proposals of its leading thinkers. Friedman proposed a "negative income tax," which pays benefits to people whose income falls below a certain level, and education vouchers that let families choose their schools. Both are policies in which the government plays a role while making use of market mechanisms. Hayek, too, did not reject a minimum guarantee of livelihood in The Road to Serfdom (1944). The ideas of Hayek and Friedman strongly influenced the economic policies centered on deregulation and privatization pursued by British Prime Minister Margaret Thatcher and US President Ronald Reagan.`,
s8:`Compared with the other seven positions, utilitarian interventionism is not a very established one. But it gains persuasive power when extraordinary situations arise.
As a form of utilitarianism, it shares its philosophical basis with one of the other seven positions, consequentialist libertarianism. Utilitarianism aims at "the greatest happiness of the greatest number" (its ultimate goal is the greatest happiness of the greatest number as an outcome) and does not presuppose abstract ideals such as equality or human rights. Even among libertarians who hold up freedom as an ideal, those who do so "because it contributes to overall welfare as a result" are consequentialist libertarians.
But this "consequentialist" way of thinking (judging by results) also justifies intervening in individual freedom and rights, sometimes drastically, if it serves the interests of society as a whole. Utilitarian interventionism is where this side comes out most strongly.
The clearest example is the lockdowns during the COVID-19 pandemic. (Tuberculosis patients, too, can still legally be hospitalized in isolation, which greatly restricts their personal freedom.) Looking back, some people may think "the lockdowns were unavoidable," but how should one have judged at a time when COVID's fatality rate and infectiousness were still unknown? This position holds that individual freedom should be legally restricted even in a country like the United States, where some people stubbornly refused to wear masks and staged protests.
People who take this position are not totalitarians, so they are tolerant of free economic activity in normal times, but they are sensitive to the problems and friction caused when claims to individual freedom and rights go too far (e.g. protests by people refusing to wear masks). Even so, unlike communitarians, they do not try to solve problems by appealing to national or local customs and traditions. For example, if there are many people with alcohol or gambling addiction, they would conclude that alcohol sales and gambling should be legally regulated, even in a country or region where drinking and gambling are a traditional part of the culture.
Jeremy Bentham (1748–1832), the English thinker who founded utilitarianism, basically encouraged individual freedom, but argued that to solve the problem of poverty, poor people should be gathered in special institutions and taught disciplined habits of life.`,
s17:`Compared with the other seven positions, conservative liberalism is a form of liberalism that takes a relatively moderate and realistic stance, emphasizing social stability and the maintenance of order. Conservative liberalism respects individual freedom while also valuing tradition and social stability. In other words, it seeks harmony between liberalism and conservatism, guaranteeing individual rights while emphasizing the preservation of institutions and customs formed over a long history.
Historically, the thought of Edmund Burke (1729–1797) is regarded as one of its sources. Burke criticized the radical social upheaval of the French Revolution, yet he also opposed the British government's hard-line policy toward the American colonies and called for reconciliation with them. In economic thought, he also shared ideas with Adam Smith (1723–1790), who stressed the importance of free markets and the division of labor. Smith argued that individuals' pursuit of self-interest in the market can, under certain conditions, also serve the interests of society as a whole. Burke valued economic freedom too, but at the same time he was wary of abruptly destroying existing order and customs. This attitude shows a hallmark of conservative liberalism: the belief that protecting freedom itself requires institutions and social bonds formed over history.
Concrete examples include education reform and the regulation of economic activity. From a conservative liberal standpoint, education reform should respect local traditions and existing institutions and be cautious about sudden change. As for economic activity, it basically supports corporate freedom and market competition while accepting the regulations needed to prevent monopolies and maintain market order. So on the one hand, it is close to libertarianism in respecting economic freedom, but it accepts a certain amount of government intervention for the sake of social stability. On the other hand, it shares communitarianism's respect for tradition and community values; but whereas communitarianism is critical of the market economy for eroding the community's role in values and moral judgment, conservative liberalism puts relatively more weight on preserving liberal institutions and the market economy. Compared with welfare-state liberalism, it also tends to be cautious about pursuing equality through income redistribution and expanded welfare.`,
s5:`National communitarianism values shared community values and national unity, and aims to harmonize individual freedom with social responsibility. While it has much in common with local communitarianism, it emphasizes nationwide unity and a sense of community. Whereas local communitarianism focuses on solving problems based on each local community's own traditions and values, national communitarianism tends to unify things across the whole country.
On issues such as same-sex marriage, for example, in countries where Christianity or Islam is deeply rooted, it would not accept same-sex marriage, however much it might increase social happiness, because it concerns the survival of tradition and culture. And when the particular culture of one region conflicts with the values of the nation as a whole, it gives more weight to the latter.
In education, too, national communitarianism holds that public schools should be places that develop character, and it is keen to bring moral education into the curriculum. In Japan, moral education became a required subject in elementary and junior high schools a few years ago, reflecting the view that schools should nurture how members of society behave and think. In religious and sex education as well, it seeks to prevent excessive individual freedom and to strike a balance with the common good. Especially in matters of public safety, individuals are expected to cooperate as members of society.
Amitai Etzioni (1929–2023), the American sociologist who represents this view, proposed a "new golden rule." Whereas the traditional golden rule ("do unto others as you would have them do unto you") concerns direct relationships between people, his "new golden rule" says "respect and uphold society's moral order as you would have society respect and uphold your autonomy," aiming to reconcile individual freedom with social responsibility. It does not deny individual freedom or autonomy; it emphasizes harmony with the public good.`,
s14:`Communitarianism values the shared values of a community, and its leading figure is the American political philosopher Michael Sandel (1953–), famous for his "Justice" lectures at Harvard. Based on the premise that people live through their ties to communities, it stresses that while individual freedom matters, we also need to consider our relationships with family and neighborhood and the well-being of the community as a whole.
Local communitarianism and national communitarianism both value community values and culture, but the community that local communitarianism has in mind is small-scale, such as a neighborhood, local government or city, and its distinctive feature is that each of us as citizens takes part in it. In today's globalizing world, it plays an important role in preserving local culture and identity.
A concrete example is the controversy over France's Évin Law. This law bans alcohol advertising on television and in cinemas nationwide for the sake of public health, but it has drawn protests from wine growers in regions with long winemaking traditions, such as Bordeaux. Tackling health problems at the national level is important, but the argument that the local tradition and distinctiveness of winemaking also deserve protection is a good illustration of local communitarian thinking.
Sandel believes that people are connected to others and to the communities they belong to, and are shaped by them. In other words, our values and ways of thinking are strongly influenced by the history and culture of the communities we belong to. For this reason, Sandel argues, we should not focus only on individual freedom and rights, but should also think about the "happiness of all" and the "common good" shared by society as a whole. It shares with welfare-state liberalism a wariness of widening economic inequality caused by excessive market forces, but because local communitarianism values the communities that sit between the individual and the state, it is critical of excessive state intervention.`

  '<div class="trail" aria-label="'+u().step(step)+'">'+dots+'</div></div>'+
  '<section class="qcard"><p class="qnum">'+u().step(step)+'　'+k+'</p><h2>'+esc(t.q)+'</h2>'+
  '<div class="ex"><b>'+u().ex+'</b><p>'+esc(t.e)+'</p></div>'+
  '<div class="answer"><button class="yes" data-n="'+y+'">'+u().yes+'</button><button class="no" data-n="'+n+'">'+u().no+'</button></div>'+
  '</section></div>';
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{path.push(b.dataset.n);draw()});
  const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{path.pop();draw()};
  const hm=document.getElementById('home');if(hm)hm.onclick=()=>{path=[];draw()};
}

let browse=null, stars=0;
function result(mine){
  const id=browse||mine, own=id===mine, c=COL[id], U=u();
  let badges='';
  for(let i=0;i<path.length-1;i++){const [k,y]=N[path[i]];badges+='<span class="badge"><b>'+k+'</b>'+(y===path[i+1]?U.yes:U.no)+'</span>'}
  const people=WHO[id].map(k=>'<div class="person">'+disc(k,c)+'<div><b>'+PN(k)+'</b><span>'+TH[k][1]+'</span></div></div>').join('');
  const types=ORDER.map(k=>'<button class="type'+(k===id?' me':'')+'" style="--c:'+COL[k]+'" data-t="'+k+'"'+(k===id?' aria-current="true"':'')+'>'+disc(WHO[k][0],COL[k])+'<span>'+RN(k)+'</span>'+(k===mine?'<small>'+U.yours+'</small>':(k===id?'<small>'+U.viewing+'</small>':''))+'</button>').join('');
  const backMine='<button class="mine" id="mine">'+U.back(RN(mine))+'</button>';
  app.innerHTML='<div style="--c:'+c+'">'+
  (own?'':'<div class="browsebar"><div class="wrap">'+backMine+'</div></div>')+
  '<header class="rhero"><div class="wrap"><div class="rtext"><p class="kicker">'+(own?U.mineK:U.browseK)+'</p><h1>'+RN(id)+'</h1>'+
  (own?'<div class="badges" aria-label="'+U.answers+'">'+badges+'</div>':'')+'</div>'+
  '<div class="rfaces">'+WHO[id].map(k=>disc(k,c)).join('')+'</div></div></header>'+
  '<div class="wrap">'+
  '<section class="sec sum"><h2>'+U.what+'</h2>'+paras(SN(id))+'</section>'+
  '<section class="sec"><h2>'+U.people+'</h2><div class="people">'+people+'</div></section>'+
  '<section class="sec"><details><summary>'+U.more+'</summary><div class="desc">'+paras(BN(id))+'</div></details></section>'+
  (own?'<section class="poster"><h2>'+U.poster+'</h2><p>'+U.posterP+'</p>'+
  '<div class="stars" role="group" aria-label="'+U.fit+'">'+[1,2,3,4,5].map(i=>'<button aria-label="'+U.fit+' '+i+'" data-s="'+i+'"'+(i<=stars?' class="on"':'')+'>★</button>').join('')+'</div>'+
  '<p class="score" id="sc">'+(stars?U.score(stars):'')+'</p>'+
  '<p class="candy">'+U.candy+'</p></section>':'')+
  '<section class="sec"><h2>'+U.eight+'</h2><p class="hint">'+U.hint+'</p><div class="types">'+types+'</div></section>'+
  '<div class="endbtns">'+(own?'':backMine)+'<button class="primary" id="re">'+U.retry+'</button>'+(own?'<button class="link" id="bk">'+U.prev+'</button>':'')+'</div>'+
  '</div></div>';
  const st=app.querySelectorAll('[data-s]');
  st.forEach(b=>b.onclick=()=>{stars=+b.dataset.s;st.forEach(x=>x.classList.toggle('on',+x.dataset.s<=stars));document.getElementById('sc').textContent=U.score(stars)});
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{browse=b.dataset.t===mine?null:b.dataset.t;draw()});
  app.querySelectorAll('.mine').forEach(b=>b.onclick=()=>{browse=null;draw()});
  document.getElementById('re').onclick=()=>{path=['s1'];browse=null;stars=0;draw()};
  const bk=document.getElementById('bk');if(bk)bk.onclick=()=>{path.pop();stars=0;draw()};
}

function draw(){
  document.documentElement.lang=lang;
  const id=path[path.length-1];
  if(!id)intro(); else if(N[id])question(id); else result(id);
  window.scrollTo(0,0);
}
draw();
</script>


</body></html>
